name: Bug report
description: Something does not behave as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Reproduction
      description: A StackBlitz, a repository, or the smallest snippet that shows it.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: vue-toast-alerts 1.0.0, vue 3.5.42, Chrome 141
    validations:
      required: true
  - type: dropdown
    id: rendering
    attributes:
      label: Rendering
      options:
        - Client only
        - Server-side rendered (Nuxt, vite-ssr, other)
    validations:
      required: true
